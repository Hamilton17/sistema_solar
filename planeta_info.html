<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sistema Solar AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#020614;
  color:#fff;
  font-family:'Exo 2',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 40% 10%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 60%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 90% 45%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,.3) 0%, transparent 100%);
  pointer-events:none;z-index:0;
}
.container{
  position:relative;z-index:1;
  max-width:480px;
  margin:0 auto;
  padding:20px 16px 60px;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.5);text-decoration:none;
  border:1px solid rgba(255,255,255,.15);border-radius:30px;
  padding:8px 16px;margin-bottom:24px;
  background:rgba(255,255,255,.04);
  cursor:pointer;
}
.planet-visual{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:28px;
}
.planet-sphere{
  width:110px;height:110px;border-radius:50%;
  margin-bottom:16px;
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
.ring-wrap{
  position:relative;display:flex;
  align-items:center;justify-content:center;
  width:200px;height:110px;margin-bottom:16px;
  animation:float 4s ease-in-out infinite;
}
.ring-wrap .planet-sphere{margin:0;animation:none;}
.ring{
  position:absolute;
  width:200px;height:28px;
  border-radius:50%;
  border:10px solid rgba(200,180,80,.45);
  transform:rotateX(70deg);
  pointer-events:none;
}
.planet-name{
  font-family:'Orbitron',monospace;
  font-size:26px;font-weight:900;
  letter-spacing:4px;text-transform:uppercase;
  text-align:center;margin-bottom:4px;
}
.planet-type{
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.4);text-align:center;
}
.stats{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin:20px 0;
}
.stat{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:11px 13px;
}
.stat-label{
  font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:4px;display:block;
}
.stat-value{
  font-family:'Orbitron',monospace;
  font-size:11px;font-weight:700;
}
.desc{
  font-size:13px;line-height:1.75;
  color:rgba(255,255,255,.55);
  text-align:center;
  padding:16px 0;
  border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:20px;
}
.fun-facts{margin-bottom:24px;}
.fun-title{
  font-family:'Orbitron',monospace;font-size:10px;
  letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:12px;
}
.fact{
  display:flex;gap:10px;align-items:flex-start;
  font-size:12px;line-height:1.6;
  color:rgba(255,255,255,.5);
  padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.fact-dot{
  width:6px;height:6px;border-radius:50%;
  flex-shrink:0;margin-top:5px;
}
.footer{
  text-align:center;
  font-size:10px;letter-spacing:2px;
  color:rgba(255,255,255,.2);
  font-family:'Orbitron',monospace;
  text-transform:uppercase;
}
.error{text-align:center;padding:60px 20px;color:rgba(255,255,255,.4);}
.error h2{font-family:'Orbitron',monospace;font-size:18px;margin-bottom:12px;}
</style>
</head>
<body>
<div class="container">
 <a id="volverBtn" class="back-btn">
  &#8592; Volver al Sistema Solar
</a>
  <div id="content"></div>
  <div class="footer">&#9728; Sistema Solar AR</div>
</div>
<script>
const PLANETS={
  sol:{name:'Sol',type:'Estrella central',color:'#FDB813',stats:[['Diámetro','1.392.000 km'],['Tipo','Estrella G2'],['Temperatura','5.500 °C'],['Edad','4.600 M años'],['Lunas','—'],['Año orbital','—']],desc:'El Sol concentra el 99,8% de toda la masa del Sistema Solar. En su núcleo la temperatura alcanza 15 millones de grados y genera energía por fusión nuclear.',facts:['Cada segundo convierte 600 millones de toneladas de hidrógeno en helio.','La luz del Sol tarda exactamente 8 minutos en llegar a la Tierra.','Su campo magnético se extiende hasta más allá de Plutón.']},
  mercurio:{name:'Mercurio',type:'1er planeta · Interior',color:'#9B9080',stats:[['Diámetro','4.879 km'],['Masa','3,3×10²³ kg'],['Al Sol','57,9 M km'],['Día','58,6 días'],['Temperatura','−180/430°C'],['Lunas','0']],desc:'El planeta más pequeño y cercano al Sol. Sin atmósfera, sufre los cambios de temperatura más extremos de todos los planetas.',facts:['Mercurio NO es el más caliente, Venus lo supera por su efecto invernadero.','Un año en Mercurio dura solo 88 días terrestres.','Su núcleo de hierro ocupa el 75% de su radio total.']},
  venus:{name:'Venus',type:'2do planeta · Interior',color:'#E8C97A',stats:[['Diámetro','12.104 km'],['Masa','4,87×10²⁴ kg'],['Al Sol','108,2 M km'],['Día','243 días (retró)'],['Temperatura','465 °C'],['Lunas','0']],desc:'El más caliente del Sistema Solar por su efecto invernadero extremo. Rota en sentido contrario: en Venus el Sol sale por el oeste.',facts:['Su presión atmosférica es 90 veces mayor que la de la Tierra.','Un día en Venus dura más que su propio año.','Su superficie es más joven que la Tierra, con volcanes activos.']},
  tierra:{name:'Tierra',type:'3er planeta · Interior',color:'#2E67B1',stats:[['Diámetro','12.742 km'],['Masa','5,97×10²⁴ kg'],['Al Sol','149,6 M km'],['Día','24 horas'],['Temperatura','−88/58 °C'],['Lunas','1']],desc:'Nuestro hogar. El único planeta conocido con vida, agua líquida y una luna que estabiliza el eje de inclinación que regula el clima.',facts:['El 71% de su superficie está cubierta por agua.','Tiene el campo magnético más activo entre los planetas rocosos.','Es el único planeta no nombrado en honor a una deidad.']},
  luna:{name:'Luna',type:'Satélite de la Tierra',color:'#AAAAAA',stats:[['Diámetro','3.474 km'],['Masa','7,34×10²² kg'],['A la Tierra','384.400 km'],['Día','27,3 días'],['Temperatura','−173/127 °C'],['Lunas','—']],desc:'El único cuerpo celeste más allá de la Tierra visitado por seres humanos. Su gravedad genera las mareas oceánicas.',facts:['12 astronautas pisaron la Luna entre 1969 y 1972 (Apollo).','La Luna se aleja de la Tierra 3,8 cm cada año.','Siempre muestra la misma cara a la Tierra: rotación sincrónica.']},
  marte:{name:'Marte',type:'4to planeta · Interior',color:'#C1440E',stats:[['Diámetro','6.779 km'],['Masa','6,39×10²³ kg'],['Al Sol','227,9 M km'],['Día','24h 37min'],['Temperatura','−125/20 °C'],['Lunas','2']],desc:'El Planeta Rojo. Su color viene del óxido de hierro. Tiene el volcán más alto del Sistema Solar y evidencia de agua en el pasado.',facts:['Olympus Mons mide 22 km — casi 3 veces el Everest.','El valle Mariner tiene 4.000 km de largo y 7 km de profundidad.','Sus lunas Fobos y Deimos son probablemente asteroides capturados.']},
  jupiter:{name:'Júpiter',type:'5to planeta · Gigante gaseoso',color:'#C88B3A',stats:[['Diámetro','139.820 km'],['Masa','1,9×10²⁷ kg'],['Al Sol','778,5 M km'],['Día','9h 56min'],['Temperatura','−110 °C'],['Lunas','95']],desc:'El gigante del Sistema Solar, con masa mayor que todos los demás planetas juntos. La Gran Mancha Roja es una tormenta activa por 350+ años.',facts:['Actúa como "escudo" gravitacional protegiendo a la Tierra de asteroides.','Su luna Europa tiene un océano líquido bajo su superficie de hielo.','Tiene el día más corto del Sistema Solar: menos de 10 horas.']},
  saturno:{name:'Saturno',type:'6to planeta · Gigante gaseoso',color:'#E8D5A3',hasRings:true,stats:[['Diámetro','116.460 km'],['Masa','5,68×10²⁶ kg'],['Al Sol','1.432 M km'],['Día','10h 42min'],['Temperatura','−140 °C'],['Lunas','146']],desc:'El señor de los anillos. Sus anillos de hielo y roca son únicos. Es tan poco denso que flotaría en agua si hubiera un océano suficientemente grande.',facts:['Sus anillos miden 282.000 km de diámetro pero solo ~1 km de grosor.','Su luna Titán tiene atmósfera más densa que la de la Tierra.','Tiene el récord de lunas confirmadas: 146.']},
  urano:{name:'Urano',type:'7mo planeta · Gigante de hielo',color:'#7FFFD4',stats:[['Diámetro','50.724 km'],['Masa','8,68×10²⁵ kg'],['Al Sol','2.867 M km'],['Día','17h 14min'],['Temperatura','−224 °C'],['Lunas','28']],desc:'El gigante de hielo azul-verde que orbita de lado con su eje inclinado 98°. Emite menos calor del que recibe del Sol.',facts:['Cada polo recibe 42 años de luz solar seguidos por su inclinación.','Fue el primer planeta descubierto con telescopio (Herschel, 1781).','Sus lunas llevan nombres de personajes de Shakespeare.']},
  neptuno:{name:'Neptuno',type:'8vo planeta · Gigante de hielo',color:'#3F54BA',stats:[['Diámetro','49.244 km'],['Masa','1,02×10²⁶ kg'],['Al Sol','4.495 M km'],['Día','16h 6min'],['Temperatura','−218 °C'],['Lunas','16']],desc:'El más lejano del Sol. Tiene los vientos más rápidos del Sistema Solar: 2.100 km/h. Su luna Tritón orbita en sentido contrario.',facts:['Su existencia fue predicha matemáticamente antes de observarlo (1846).','Un año en Neptuno dura 165 años terrestres.','Voyager 2 es el único artefacto humano que lo ha visitado (1989).']},
  pluton:{name:'Plutón',type:'Planeta enano · Cinturón de Kuiper',color:'#B0A090',stats:[['Diámetro','2.376 km'],['Masa','1,3×10²² kg'],['Al Sol','5.906 M km'],['Día','6,4 días'],['Temperatura','−233 °C'],['Lunas','5']],desc:'Planeta enano reclasificado en 2006. Tiene montañas de hielo de hasta 3.500 m. Visitado por New Horizons en 2015.',facts:['Fue descubierto en 1930 por Clyde Tombaugh con solo 24 años.','Su luna Caronte es tan grande que forman un sistema binario.','New Horizons reveló un corazón brillante de nitrógeno helado.']}
};

function lighten(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return '#'+[r+a,g+a,b+a].map(v=>Math.min(255,Math.max(0,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function darken(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return '#'+[r-a,g-a,b-a].map(v=>Math.min(255,Math.max(0,Math.round(v))).toString(16).padStart(2,'0')).join('');}

function render(){
  const params=new URLSearchParams(window.location.search);
  const pid=(params.get('p')||params.get('planeta')||'tierra').toLowerCase();
  const d=PLANETS[pid];
  const el=document.getElementById('content');
  if(!d){el.innerHTML='<div class="error"><h2>Planeta no encontrado</h2><p>Usa ?p=tierra</p></div>';return;}

  const sphere=d.hasRings
    ?`<div class="ring-wrap"><div class="planet-sphere" style="background:radial-gradient(circle at 35% 30%,${lighten(d.color,50)},${d.color} 55%,${darken(d.color,40)});box-shadow:0 0 40px ${d.color}44;"></div><div class="ring" style="border-color:${d.color}66;"></div></div>`
    :`<div class="planet-sphere" style="background:radial-gradient(circle at 35% 30%,${lighten(d.color,50)},${d.color} 55%,${darken(d.color,40)});box-shadow:0 0 40px ${d.color}44;"></div>`;

  const statsHTML=d.stats.map(([l,v])=>`<div class="stat"><span class="stat-label">${l}</span><span class="stat-value" style="color:${d.color}">${v}</span></div>`).join('');
  const factsHTML=d.facts.map(f=>`<div class="fact"><div class="fact-dot" style="background:${d.color}"></div><span>${f}</span></div>`).join('');

  el.innerHTML=`
    <div class="planet-visual">${sphere}
      <h1 class="planet-name" style="color:${d.color};text-shadow:0 0 30px ${d.color}55">${d.name}</h1>
      <p class="planet-type">${d.type}</p>
    </div>
    <div class="stats">${statsHTML}</div>
    <p class="desc">${d.desc}</p>
    <div class="fun-facts"><p class="fun-title">Datos curiosos</p>${factsHTML}</div>
  `;
}
render();

/* =====================================================
   BOTÓN VOLVER
===================================================== */

document
  .getElementById('volverBtn')
  .addEventListener('click', ()=>{

    window.parent.postMessage({

      type:'SS_CLOSE'

    }, '*');

});

</script>
</body>
</html>
