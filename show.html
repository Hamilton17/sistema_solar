<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sistema Solar AR</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#020614;
  color:#fff;
  font-family:'Exo 2',sans-serif;
  display:flex;flex-direction:column;
}

/* Estrellas de fondo */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 22% 38%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 38% 8%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 52% 55%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 68% 22%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 78% 68%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 42%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 12% 75%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 58% 82%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 32% 62%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 45% 90%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 92% 15%,rgba(255,255,255,.6) 0%,transparent 100%);
  pointer-events:none;z-index:0;
}

.page{
  position:relative;z-index:1;
  flex:1;overflow-y:auto;
  padding:16px 16px 24px;
  -webkit-overflow-scrolling:touch;
}

/* Header planeta */
.p-header{
  display:flex;align-items:center;gap:14px;
  padding:4px 0 16px;
  border-bottom:1px solid rgba(255,255,255,.07);
  margin-bottom:16px;
}
.p-sphere{
  width:58px;height:58px;border-radius:50%;
  flex-shrink:0;
  animation:glow 3s ease-in-out infinite alternate;
}
@keyframes glow{
  from{filter:brightness(1);}
  to{filter:brightness(1.2);}
}
.ring-wrap{
  position:relative;width:90px;height:58px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ring-wrap .p-sphere{animation:glow 3s ease-in-out infinite alternate;}
.p-ring{
  position:absolute;
  width:90px;height:16px;
  border-radius:50%;
  border:6px solid rgba(200,180,80,.45);
  transform:rotateX(72deg);
  pointer-events:none;
}
.p-name{
  font-family:'Orbitron',monospace;
  font-size:18px;font-weight:900;
  letter-spacing:3px;text-transform:uppercase;
  line-height:1.2;margin-bottom:3px;
}
.p-type{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}

/* Stats */
.p-stats{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:1px;background:rgba(255,255,255,.05);
  border-radius:12px;overflow:hidden;
  margin-bottom:14px;
}
.p-stat{
  background:#020614;
  padding:10px 10px;
}
.p-lbl{
  display:block;font-size:8px;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(255,255,255,.3);
  margin-bottom:3px;
}
.p-val{
  display:block;font-family:'Orbitron',monospace;
  font-size:10px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Descripción */
.p-desc{
  font-size:12.5px;line-height:1.7;
  color:rgba(255,255,255,.55);
  padding:12px 0;
  border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:12px;
}

/* Dato curioso */
.p-fact{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px 12px;
  background:rgba(255,255,255,.03);
  border-radius:10px;
  border:1px solid rgba(255,255,255,.06);
}
.p-fact-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.p-fact-text{
  font-size:12px;line-height:1.6;
  color:rgba(255,255,255,.45);
  font-style:italic;
}

/* Loading */
#loading{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:100%;gap:16px;
  color:rgba(255,255,255,.3);
  font-size:12px;letter-spacing:2px;
}
.spinner{
  width:32px;height:32px;border-radius:50%;
  border:2px solid rgba(127,255,212,.15);
  border-top-color:#7FFFD4;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="page">
  <div id="loading">
    <div class="spinner"></div>
    <span>CARGANDO</span>
  </div>
  <div id="content" style="display:none"></div>
</div>

<script>
const PLANETS={
  sol:{name:'Sol',type:'Estrella central',color:'#FDB813',
    stats:[['Diámetro','1.392.000 km'],['Tipo','Estrella G2'],['Temperatura','5.500 °C'],['Al Sol','Centro'],['Lunas','—'],['Año','—']],
    desc:'Concentra el 99,8% de la masa del Sistema Solar. En su núcleo alcanza 15 millones de grados generando energía por fusión nuclear.',
    fact:'La luz del Sol tarda 8 minutos y 20 segundos en llegar a la Tierra.'},
  mercurio:{name:'Mercurio',type:'1er planeta · Rocoso',color:'#9B9080',
    stats:[['Diámetro','4.879 km'],['Al Sol','57,9 M km'],['Día','58,6 días'],['Temperatura','−180/430°C'],['Lunas','0'],['Año','88 días']],
    desc:'El más pequeño y cercano al Sol. Sin atmósfera, sufre cambios térmicos extremos entre día y noche.',
    fact:'Mercurio NO es el más caliente del Sistema Solar — Venus lo supera por su efecto invernadero.'},
  venus:{name:'Venus',type:'2do planeta · Rocoso',color:'#E8C97A',
    stats:[['Diámetro','12.104 km'],['Al Sol','108,2 M km'],['Día','243 días'],['Temperatura','465 °C'],['Lunas','0'],['Año','225 días']],
    desc:'El más caliente por su efecto invernadero extremo. Rota al revés: en Venus el Sol sale por el oeste.',
    fact:'Un día en Venus dura más que un año venusiano completo.'},
  tierra:{name:'Tierra',type:'3er planeta · Rocoso',color:'#2E67B1',
    stats:[['Diámetro','12.742 km'],['Al Sol','149,6 M km'],['Día','24 horas'],['Temperatura','−88/58 °C'],['Lunas','1'],['Año','365 días']],
    desc:'Nuestro hogar. El único planeta conocido con vida, agua líquida y una luna que estabiliza el eje de rotación.',
    fact:'El 71% de la superficie terrestre está cubierta por agua.'},
  luna:{name:'Luna',type:'Satélite de la Tierra',color:'#AAAAAA',
    stats:[['Diámetro','3.474 km'],['A Tierra','384.400 km'],['Día','27,3 días'],['Temperatura','−173/127°C'],['Lunas','—'],['Año','27,3 días']],
    desc:'El único cuerpo celeste más allá de la Tierra visitado por humanos. Su gravedad genera las mareas oceánicas.',
    fact:'12 astronautas pisaron la Luna entre 1969 y 1972 en las misiones Apollo.'},
  marte:{name:'Marte',type:'4to planeta · Rocoso',color:'#C1440E',
    stats:[['Diámetro','6.779 km'],['Al Sol','227,9 M km'],['Día','24h 37m'],['Temperatura','−125/20°C'],['Lunas','2'],['Año','687 días']],
    desc:'El Planeta Rojo. Tiene el volcán más alto del Sistema Solar (Olympus Mons, 22 km) y evidencia de agua en el pasado.',
    fact:'Un día marciano dura solo 37 minutos más que un día terrestre.'},
  jupiter:{name:'Júpiter',type:'5to planeta · Gas gigante',color:'#C88B3A',
    stats:[['Diámetro','139.820 km'],['Al Sol','778,5 M km'],['Día','9h 56m'],['Temperatura','−110 °C'],['Lunas','95'],['Año','11,9 años']],
    desc:'El gigante del Sistema Solar. Su masa supera la de todos los demás planetas juntos. La Gran Mancha Roja lleva 350+ años activa.',
    fact:'Júpiter actúa como escudo gravitacional protegiendo a la Tierra de asteroides.'},
  saturno:{name:'Saturno',type:'6to planeta · Gas gigante',color:'#E8D5A3',rings:true,
    stats:[['Diámetro','116.460 km'],['Al Sol','1.432 M km'],['Día','10h 42m'],['Temperatura','−140 °C'],['Lunas','146'],['Año','29,4 años']],
    desc:'El señor de los anillos. Tan poco denso que flotaría en agua. Su luna Titán tiene atmósfera más densa que la Tierra.',
    fact:'Los anillos de Saturno miden 282.000 km de diámetro pero solo ~1 km de grosor.'},
  urano:{name:'Urano',type:'7mo planeta · Hielo gigante',color:'#7FFFD4',
    stats:[['Diámetro','50.724 km'],['Al Sol','2.867 M km'],['Día','17h 14m'],['Temperatura','−224 °C'],['Lunas','28'],['Año','84 años']],
    desc:'El gigante de hielo azul-verde que orbita de lado con su eje inclinado 98°. Emite menos calor del que recibe.',
    fact:'Cada polo de Urano recibe 42 años de luz solar seguidos de 42 años de oscuridad.'},
  neptuno:{name:'Neptuno',type:'8vo planeta · Hielo gigante',color:'#3F54BA',
    stats:[['Diámetro','49.244 km'],['Al Sol','4.495 M km'],['Día','16h 6m'],['Temperatura','−218 °C'],['Lunas','16'],['Año','165 años']],
    desc:'El más lejano del Sol. Tiene los vientos más rápidos del Sistema Solar: hasta 2.100 km/h.',
    fact:'Su existencia fue predicha matemáticamente antes de ser observado con telescopio (1846).'},
  pluton:{name:'Plutón',type:'Planeta enano',color:'#B0A090',
    stats:[['Diámetro','2.376 km'],['Al Sol','5.906 M km'],['Día','6,4 días'],['Temperatura','−233 °C'],['Lunas','5'],['Año','248 años']],
    desc:'Planeta enano en el cinturón de Kuiper, reclasificado en 2006. New Horizons reveló montañas de hielo de 3.500 m.',
    fact:'La luna de Plutón, Caronte, es tan grande que forman un sistema binario.'},
};

function L(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return '#'+[r+a,g+a,b+a].map(v=>Math.min(255,Math.max(0,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function D(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return '#'+[r-a,g-a,b-a].map(v=>Math.min(255,Math.max(0,Math.round(v))).toString(16).padStart(2,'0')).join('');}

function render(){
  const p=new URLSearchParams(location.search);
  const pid=(p.get('p')||'tierra').toLowerCase();
  const d=PLANETS[pid];

  document.getElementById('loading').style.display='none';
  const el=document.getElementById('content');
  el.style.display='block';

  if(!d){el.innerHTML='<p style="text-align:center;color:rgba(255,255,255,.4);padding:40px">Planeta no encontrado</p>';return;}

  const vis=d.rings
    ?`<div class="ring-wrap"><div class="p-sphere" style="background:radial-gradient(circle at 33% 30%,${L(d.color,55)},${d.color} 52%,${D(d.color,48)});box-shadow:0 0 28px ${d.color}66;"></div><div class="p-ring" style="border-color:${d.color}55;"></div></div>`
    :`<div class="p-sphere" style="background:radial-gradient(circle at 33% 30%,${L(d.color,55)},${d.color} 52%,${D(d.color,48)});box-shadow:0 0 28px ${d.color}66;width:58px;height:58px;border-radius:50%;flex-shrink:0;animation:glow 3s ease-in-out infinite alternate;"></div>`;

  const stats=d.stats.map(([l,v])=>`<div class="p-stat"><span class="p-lbl">${l}</span><span class="p-val" style="color:${d.color}">${v}</span></div>`).join('');

  el.innerHTML=`
    <div class="p-header">
      ${vis}
      <div>
        <div class="p-name" style="color:${d.color};text-shadow:0 0 20px ${d.color}55">${d.name}</div>
        <div class="p-type">${d.type}</div>
      </div>
    </div>
    <div class="p-stats">${stats}</div>
    <p class="p-desc">${d.desc}</p>
    <div class="p-fact">
      <span class="p-fact-icon">💡</span>
      <span class="p-fact-text">${d.fact}</span>
    </div>
  `;

  /* Notificar al padre (Onirix) que ya cargamos — por si usa iframe */
  try {
    window.parent.postMessage({ type: 'SS_LOADED', planet: pid }, '*');
  } catch(e) {}
}

render();
</script>
</body>
</html>
